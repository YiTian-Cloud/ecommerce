<h2>Your Cart</h2>

<div *ngIf="items().length === 0">
  Cart is empty.
</div>

<table *ngIf="items().length > 0" class="cart-table">
  <thead>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Price</th>
      <th>Subtotal</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of items()">
      <td>{{ item.product.name }}</td>
      <td>{{ item.quantity }}</td>
      <td>${{ item.product.price | number : '1.2-2' }}</td>
      <td>${{ item.product.price * item.quantity | number : '1.2-2' }}</td>
      <td><button (click)="remove(item.product._id)">Remove</button></td>
    </tr>
  </tbody>
</table>

<div *ngIf="items().length > 0" class="summary">
  <p>Total: <strong>${{ total() | number : '1.2-2' }}</strong></p>
  <a routerLink="/checkout" class="checkout-link">Proceed to Checkout</a>
</div>
